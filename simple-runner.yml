buttons:
  - id: workspace-init
    label: Workspace - initialize the Python virtual environment
    cwd: .
    script: |
      python -m venv .venv
      source ./.venv/bin/activate
      pip install -r requirements.txt

  - id: crawler-build
    label: Crawler - build
    cwd: crawler
    script: make

  - id: crawler-unit-test
    label: Crawler - run unit-tests
    cwd: crawler
    script: make unit-test

  - id: crawler-integration-test
    label: Crawler - run integration tests
    cwd: crawler
    script: make integration-test

  - id: crawler-full-test
    label: Crawler - run full tests
    cwd: crawler
    script: make test

  - id: crawler-clean
    label: Crawler - clean
    cwd: crawler
    script: make clean

  - id: frontend-setup
    label: Frontend - run setup
    cwd: frontend
    script: |
      apt-get install ruby-full build-essential
      gem install jekyll bundler
      bundle install
    
  - id: frontend-sync
    label: Frontend - synchronize chart data
    cwd: .
    script: |
      #!/bin/bash
      # frontend/_data is a committed copy; query.py writes only into
      # statistics/data, so without this the charts keep serving the old copy.
      .venv/bin/python frontend/sync_data.py

  - id: frontent-serve
    label: Frontend - serve
    cwd: frontend
    script: |
      #!/bin/bash
      # Refresh the copied data first, so serving can never show a stale chart.
      ../.venv/bin/python sync_data.py || exit 1

      bundle exec jekyll serve

  - id: statistics-sync
    label: Statistics - synchronize data
    cwd: statistics
    script: |
      # TODO: verify as it seems not to work
      # ./sync_chain.sh

      source ../.venv/bin/activate
      python src/data/query.py

      python src/core/run_onchain_features.py
      python src/core/run_exposure.py

  - id: statistics-daily-run
    label: Statistics - daily run
    cwd: statistics
    script: |
      #!/bin/bash
      # Remove the old generated file to start clean
      rm -f out/daily_reading.txt
     
      # Clean the console
      echo "Press ENTER to continue."
      read

      # Get the start date
      while true; do
          read -r -p "Enter start date (yyyy-MM-DD): " start
          [[ $start =~ ^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$ ]] && break
          echo "Only digits allowed."
      done

      # Get the stop date
      while true; do
          read -r -p "Enter end date (yyyy-MM-DD): " end
          [[ $end =~ ^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$ ]] && break
          echo "Only digits allowed."
      done

      source ../.venv/bin/activate

      python src/util/print_features_range.py \
        $start \
        $end \
        --path out/features.csv >> out/daily_reading.txt

      python src/util/print_features_range.py \
        $start \
        $end \
        --path out/onchain_features.csv >> out/daily_reading.txt

      python src/util/safe_touch_probabilities.py --date $end >> out/daily_reading.txt

  - id: statistics-features-viewer
    label: Statistics - features viewer
    cwd: statistics
    script: |
      #!/bin/bash
      # Serve statistics/ as the document root: viewer/dashboard.html fetches
      # ../out/features.csv and ../data/*.json by relative path.
      source ../.venv/bin/activate

      url=http://127.0.0.1:8000/viewer/dashboard.html

      python -m http.server 8000 --bind 127.0.0.1 &
      server=$!
      trap 'kill $server 2>/dev/null' EXIT

      # Fail loudly if the port was already taken. Otherwise the wait loop below
      # would succeed against whatever else is serving there, the browser would
      # show that instead, and this script would exit immediately.
      sleep 1
      if ! kill -0 "$server" 2>/dev/null; then
          echo "Could not bind port 8000 - another server is probably still running." >&2
          exit 1
      fi

      # Wait for the port to accept connections before opening the browser,
      # otherwise the page is requested while nothing is listening yet.
      for _ in $(seq 1 40); do
          curl -sf -o /dev/null "$url" && break
          sleep 0.25
      done

      firefox "$url" &

      echo "Serving statistics/ at $url - press Ctrl+C to stop."
      wait $server

  - id: statistics-safe-dashboard
    label: Statistics - SAFE signal dashboard
    cwd: statistics
    script: |
      #!/bin/bash
      # The eight registered signal views, date-aligned against daily_price.json.
      # Binds the port before opening the browser, so no wait loop is needed.
      source ../.venv/bin/activate
      python src/dashboard/run_dashboard.py --open-browser

  - id: strategies-candles
    label: Strategies - candles similarities
    cwd: strategies
    script: |
      # Clean the console
      echo "Press ENTER to continue."
      read

      # Get the start date
      while true; do
          read -r -p "Enter start date (yyyy-MM-DD): " start
          [[ $start =~ ^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$ ]] && break
          echo "Only digits allowed."
      done

      # Get the stop date
      while true; do
          read -r -p "Enter end date (yyyy-MM-DD): " end
          [[ $end =~ ^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$ ]] && break
          echo "Only digits allowed."
      done

      source ../.venv/bin/activate

      python candles_btc_features.py \
        --input ../statistics/out/features.csv \
        --input-fmt csv \
        --output out.csv

      python candlestick_research_tool_v4.py \
        --input out.csv \
        --key-col date \
        --start $start \
        --end $end \
        --standardize \
        --metric euclidean \
        --min-sim 0.50 \
        --out-dir research_out_v4

      firefox research_out_v4/report.html
